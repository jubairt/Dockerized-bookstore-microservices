version: "3.9"

services:
  book_service:
    build: ./book_service
    container_name: book_service
    ports:
      - "8002:8002"
    env_file:
      - ./book_service/.env
    depends_on:
      - db

  order_service:
    build: ./order_service
    container_name: order_service
    ports:
      - "8003:8003"
    env_file:
      - ./order_service/.env
    depends_on:
      - db
      - book_service  # because it communicates with book_service

  user_service:
    build: ./user_service
    container_name: user_service
    ports:
      - "8001:8001"
    env_file:
      - ./user_service/.env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jubair
      POSTGRES_DB: book_db  # initial default DB, but we’ll create all 3 via init.sql
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml


volumes:
  postgres_data:
